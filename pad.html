<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draw Pad">
<meta name="theme-color" content="#0e0e12">
<title>Draw Pad</title>
<style>
:root{--bg:#0e0e12;--panel:rgba(30,30,37,.92);--border:rgba(255,255,255,.09);--text:#f4f4f5;--sub:#a1a1aa;--accent:#818cf8;--ok:#34d399;--warn:#fbbf24;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#pad{position:fixed;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
#pad canvas{position:absolute;inset:0;width:100%;height:100%}
button{appearance:none;border:0;background:transparent;color:var(--text);font:600 13px var(--font);border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
button:active{transform:scale(.94)}
button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* floating controls: sit in the spare space beside the pad, or over its corner */
#ctl{position:fixed;z-index:5;display:flex;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--border);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#ctl.vert{flex-direction:column}
#ctl button{width:42px;height:42px}
#ctl .dot{width:11px;height:11px;border-radius:50%;background:var(--warn)}
#ctl .dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.25)}
#ctl button.on{background:var(--accent);color:#0e0e14}
#ctl .cur{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85)}

/* settings sheet */
#sheet{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.45)}
#sheet.open{display:grid}
#sheet .card{width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#1b1b21;border:1px solid var(--border);
  border-radius:20px;padding:16px 16px 12px}
#sheet h4{margin:4px 4px 10px;font:700 11px var(--font);letter-spacing:.8px;text-transform:uppercase;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sw{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sw.on{box-shadow:0 0 0 3px #1b1b21,0 0 0 5px var(--accent)}
.chip{height:42px;padding:0 14px;background:rgba(255,255,255,.06)}
.chip.on{background:var(--accent);color:#0e0e14}
.wd i{display:block;width:22px;border-radius:6px;background:currentColor}
.tip{font-size:13px;line-height:1.45;color:var(--sub);background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.tip b{color:var(--text)}
#status{font:600 13px var(--font);color:var(--sub);margin:0 4px 12px;display:flex;align-items:center;gap:8px}

@media (max-height:500px){
  #sheet .card{width:min(640px,calc(100vw - 24px));padding:12px 14px 10px}
  #sheet h4{margin:2px 4px 6px}
  .row{margin-bottom:8px;gap:6px}
  .sw{width:34px;height:34px}
  .chip{height:36px;padding:0 12px}
  #status{margin-bottom:8px}
}
#msg{position:fixed;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:24px;pointer-events:none}
#msg div{background:rgba(14,14,18,.88);border:1px solid var(--border);border-radius:16px;padding:16px 20px;max-width:340px;font-size:15px;line-height:1.45}
#msg b{display:block;font-size:17px;margin-bottom:4px}
#rot{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;font:600 12.5px var(--font);color:#71717a;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="pad"><canvas id="cv"></canvas></div>
<div id="ctl">
  <button id="menu" aria-label="Menu"><span class="dot" id="dot"></span></button>
  <button id="curBtn" aria-label="Colour"><span class="cur" id="cur"></span></button>
  <button id="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button id="toolBtn" aria-label="Pen or eraser"></button>
  <button id="keepBtn" aria-label="Keep drawings on the phone"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<div id="hint" style="position:fixed;z-index:6;display:none;background:#f4f4f5;color:#18181b;font:600 13px var(--font);padding:9px 12px;border-radius:10px;pointer-events:none"></div>
<div id="rot"></div>
<div id="msg"><div><b>Connecting to your laptop…</b>Keep the whiteboard open on the laptop.</div></div>

<div id="sheet">
  <div class="card">
    <div id="status"><span class="dot" id="dot2" style="width:9px;height:9px;border-radius:50%;background:var(--warn)"></span><span id="stText" style="flex:1">Connecting…</span><button class="chip on" id="done">Done</button></div>
    <h4>Colour</h4><div class="row" id="colors"></div>
    <h4>Thickness</h4><div class="row" id="widths"></div>
    <h4>Tool</h4>
    <div class="row">
      <button class="chip" id="pen">Pen</button><button class="chip" id="eraser">Eraser</button>
      <button class="chip" id="undo2">Undo</button><button class="chip" id="redo">Redo</button>
    </div>
    <h4>Screen</h4>
    <div class="row">
      <button class="chip" id="fit">Match laptop shape</button><button class="chip" id="fill">Stretch to fill</button>
      <button class="chip" id="fs">Fullscreen</button>
    </div>
    <h4>On the phone</h4>
    <div class="row">
      <button class="chip" id="fade">Fade drawings</button><button class="chip" id="keep">Keep drawings (show the board)</button>
    </div>
    <div class="tip" id="iosTip" style="display:none"><b>Full screen on iPhone:</b> tap Share → <b>Add to Home Screen</b>, then open Draw Pad from your home screen. Safari's bars disappear.</div>  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const id = decodeURIComponent(location.hash.slice(1));
const pad = $('#pad'), cv = $('#cv'), ctx = cv.getContext('2d'), ctl = $('#ctl');
const PEN = '<svg viewBox="0 0 24 24"><path d="M4 20l4.5-1L19 8.5 15.5 5 5 15.5z"/></svg>';
const ERASER = '<svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 13.4l8.8-8.8a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11 19H8l-3.4-3.4a1.5 1.5 0 0 1 0-2.2z"/></svg>';
const isIOS = /iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 && /Mobile/.test(navigator.userAgent));
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let fill = false; try { fill = localStorage.getItem('pad-fill') === '1'; } catch(e){}
let keep = false; try { keep = localStorage.getItem('pad-keep') === '1'; } catch(e){}
let board = null;
let conn = null, peer = null, aspect = 16/10, state = {color:'ink', wi:1, tool:'pen', colors:[], bg:'#ffffff'};
let rect = null, active = null, trails = [], raf = 0, wake = null;

function msg(title, text){ const m = $('#msg'); if (!title){ m.style.display = 'none'; return; } m.style.display = 'grid'; m.innerHTML = `<div><b>${title}</b>${text}</div>`; }
function status(text, live){
  $('#stText').textContent = text;
  $('#dot').classList.toggle('live', !!live);
  $('#dot2').style.background = live ? 'var(--ok)' : 'var(--warn)';
}
const send = d => { if (conn && conn.open) try { conn.send(d); } catch(e){} };

/* ---------- layout: biggest pad that fits, controls in the spare space ---------- */
function layout(){
  const W = innerWidth, H = innerHeight, m = 4, C = 56;   // C = control strip thickness
  let x, y, w, h, mode;
  const fitIn = (aw, ah) => { let ww = aw, hh = ww / aspect; if (hh > ah){ hh = ah; ww = hh * aspect; } return [ww, hh]; };
  if (fill){ [x, y, w, h] = [m, m, W - 2*m, H - 2*m]; mode = 'over'; }
  else {
    const [fw, fh] = fitIn(W - 2*m, H - 2*m);
    if (W - fw >= 2*C){ [w, h] = fitIn(W - 2*m - C, H - 2*m); x = C + m + (W - C - 2*m - w)/2; y = (H - h)/2; mode = 'side'; }
    else if (H - fh >= 2*C){ [w, h] = fitIn(W - 2*m, H - 2*m - C); x = (W - w)/2; y = C + m + (H - C - 2*m - h)/2; mode = 'top'; }
    else { [w, h] = [fw, fh]; x = (W - w)/2; y = (H - h)/2; mode = 'over'; }
  }
  Object.assign(pad.style, {left:x+'px', top:y+'px', width:w+'px', height:h+'px', borderRadius: (mode === 'over' && fill) ? '10px' : '14px'});
  ctl.classList.toggle('vert', mode === 'side');
  Object.assign(ctl.style, mode === 'side' ? {left:'6px', top:'50%', transform:'translateY(-50%)'}
    : mode === 'top' ? {left:'50%', top:'6px', transform:'translateX(-50%)'}
    : {left:'10px', top:'10px', transform:'none'});
  ctl.style.opacity = mode === 'over' ? '.82' : '1';
  const dpr = devicePixelRatio || 1;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  rect = null;
  $('#rot').textContent = (H > W && aspect > 1) ? 'Turn your phone sideways for a bigger pad' : '';
  $('#fit').classList.toggle('on', !fill); $('#fill').classList.toggle('on', fill);
  paint();
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);

/* ---------- controls ---------- */
function colorHex(k){ const f = state.colors.find(c => c[0] === k); return f ? f[1] : '#18181b'; }
function syncUI(){
  $('#cur').style.background = colorHex(state.color);
  $('#toolBtn').innerHTML = state.tool === 'eraser' ? ERASER : PEN;
  $('#toolBtn').style.color = state.tool === 'eraser' ? '#fb7185' : '';
  const c = $('#colors'); c.innerHTML = '';
  for (const [k, hex] of state.colors){
    const b = document.createElement('button'); b.className = 'sw' + (k === state.color ? ' on' : ''); b.style.background = hex;
    b.onclick = () => { send({cmd:'color', v:k}); if (state.tool === 'eraser') send({cmd:'tool', v:'pen'}); };
    c.appendChild(b);
  }
  const w = $('#widths'); w.innerHTML = '';
  [3,6,11].forEach((px, i) => {
    const b = document.createElement('button'); b.className = 'chip wd' + (i === state.wi ? ' on' : '');
    b.innerHTML = `<i style="height:${px}px"></i>`; b.onclick = () => send({cmd:'width', v:i}); w.appendChild(b);
  });
  $('#pen').classList.toggle('on', state.tool !== 'eraser');
  $('#eraser').classList.toggle('on', state.tool === 'eraser');
  pad.style.background = state.bg;
}
const openSheet = () => $('#sheet').classList.add('open');
$('#menu').onclick = openSheet; $('#curBtn').onclick = openSheet;
$('#done').onclick = () => $('#sheet').classList.remove('open');
$('#sheet').addEventListener('pointerdown', e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('open'); });
$('#undo').onclick = $('#undo2').onclick = () => send({cmd:'undo'});
$('#redo').onclick = () => send({cmd:'redo'});
$('#toolBtn').onclick = () => send({cmd:'tool', v: state.tool === 'eraser' ? 'pen' : 'eraser'});
$('#pen').onclick = () => send({cmd:'tool', v:'pen'});
$('#eraser').onclick = () => send({cmd:'tool', v:'eraser'});
const setFill = v => { fill = v; try { localStorage.setItem('pad-fill', v ? '1' : '0'); } catch(e){} layout(); };
$('#fit').onclick = () => setFill(false);
$('#fill').onclick = () => setFill(true);
const canFS = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function goFull(){
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  try { (el.requestFullscreen ? el.requestFullscreen({navigationUI:'hide'}) : el.webkitRequestFullscreen()).catch?.(() => {}); } catch(e){}
}
$('#fs').onclick = goFull;
function hint(text){
  const h = $('#hint'); h.textContent = text;
  Object.assign(h.style, {display:'block', left:'50%', top:'14px', transform:'translateX(-50%)'});
  clearTimeout(hint.t); hint.t = setTimeout(() => h.style.display = 'none', 1800);
}
function setKeep(v, quiet){
  keep = v; try { localStorage.setItem('pad-keep', v ? '1' : '0'); } catch(e){}
  if (!v) board = null;
  send({cmd:'mirror', v});
  $('#keepBtn').classList.toggle('on', v);
  $('#keep').classList.toggle('on', v); $('#fade').classList.toggle('on', !v);
  if (!quiet) hint(v ? 'Drawings stay on the phone' : 'Drawings fade on the phone');
  paint();
}
$('#keepBtn').onclick = () => setKeep(!keep);
$('#keep').onclick = () => setKeep(true);
$('#fade').onclick = () => setKeep(false);

/* board mirror renderer (same look as the laptop) */
const font = sz => `600 ${sz}px -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif`;
function bbox(o){ return [Math.min(o.x1,o.x2), Math.min(o.y1,o.y2), Math.max(o.x1,o.x2), Math.max(o.y1,o.y2)]; }
function softFill(){ ctx.save(); ctx.globalAlpha *= board.dark ? .14 : .07; ctx.fill(); ctx.restore(); }
function drawObj(o){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = o.c; ctx.lineWidth = o.w;
  ctx.beginPath();
  if (o.t === 'pen'){
    const p = o.pts, n = p.length/2;
    if (n === 1){ ctx.arc(p[0], p[1], o.w/2, 0, Math.PI*2); ctx.fill(); return; }
    ctx.moveTo(p[0], p[1]);
    for (let i = 1; i < n-1; i++) ctx.quadraticCurveTo(p[2*i], p[2*i+1], (p[2*i]+p[2*i+2])/2, (p[2*i+1]+p[2*i+3])/2);
    ctx.lineTo(p[2*n-2], p[2*n-1]); ctx.stroke();
  } else if (o.t === 'line' || o.t === 'arrow'){
    ctx.moveTo(o.x1, o.y1); ctx.lineTo(o.x2, o.y2);
    if (o.t === 'arrow'){
      const a = Math.atan2(o.y2-o.y1, o.x2-o.x1), len = Math.hypot(o.x2-o.x1, o.y2-o.y1);
      const hl = Math.min(o.w*2.5 + 12*(o.w/4)**.5, len*.5);
      ctx.moveTo(o.x2 - hl*Math.cos(a-.48), o.y2 - hl*Math.sin(a-.48)); ctx.lineTo(o.x2, o.y2);
      ctx.lineTo(o.x2 - hl*Math.cos(a+.48), o.y2 - hl*Math.sin(a+.48));
    }
    ctx.stroke();
  } else if (o.t === 'rect'){
    const [a,b,c,d] = bbox(o), w = c-a, h = d-b;
    ctx.roundRect(a, b, w, h, Math.max(0, Math.min(o.r || 14, w/4, h/4)));
    if (o.fill) softFill(); ctx.stroke();
  } else if (o.t === 'ellipse'){
    ctx.ellipse((o.x1+o.x2)/2, (o.y1+o.y2)/2, Math.abs(o.x2-o.x1)/2, Math.abs(o.y2-o.y1)/2, 0, 0, Math.PI*2);
    if (o.fill) softFill(); ctx.stroke();
  } else if (o.t === 'text'){
    ctx.font = font(o.size); ctx.textBaseline = 'top';
    o.text.split('\n').forEach((l, i) => {
      const lx = o.align === 'center' ? o.x - ctx.measureText(l).width/2 : o.x;
      ctx.fillText(l, lx, o.y + i*o.size*1.25 + o.size*.1);
    });
  }
}
function drawBoard(w, h){
  if (!keep || !board) return;
  const v = board.v;
  ctx.save();
  ctx.transform(w/board.W, 0, 0, h/board.H, 0, 0);
  ctx.transform(v.z, 0, 0, v.z, v.x, v.y);
  for (const o of board.objs) try { drawObj(o); } catch(e){}
  ctx.restore();
}
if (!canFS || standalone) $('#fs').style.display = 'none';
if (isIOS && !standalone) $('#iosTip').style.display = 'block';

/* ---------- touch → normalized board coordinates ---------- */
function norm(e){
  rect = rect || pad.getBoundingClientRect();
  return { x: Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)),
           y: Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height)) };
}
let triedFS = false, lastTouchT = 0, lastPt = {x:0, y:0};
pad.addEventListener('pointerdown', e => {
  // one finger draws; a second finger is ignored — unless the first one went quiet (its "lift" got lost), then start fresh
  if (active !== null){
    if (performance.now() - lastTouchT < 250) return;
    up({pointerId: active, clientX: 0, clientY: 0, stale: true});
  }
  e.preventDefault();
  lastTouchT = performance.now();
  if (!triedFS && canFS && !standalone){ triedFS = true; goFull(); }
  active = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch(err){}
  const p = norm(e);
  send({t:'d', x:p.x, y:p.y});
  trails.push({pts:[p], c: state.tool === 'eraser' ? 'rgba(225,29,72,.5)' : colorHex(state.color), w:[3,6,11][state.wi] * (state.tool === 'eraser' ? 3 : 1), end:0});
  keepAwake(); loop();
});
pad.addEventListener('pointermove', e => {
  if (e.pointerId !== active) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const t = trails[trails.length-1];
  lastTouchT = performance.now();
  for (const ev of (evs.length ? evs : [e])){ const p = norm(ev); lastPt = p; send({t:'m', x:p.x, y:p.y}); if (t) t.pts.push(p); }
});
function up(e){
  if (e.pointerId !== active) return;
  active = null;
  const p = e.stale ? lastPt : norm(e); send({t:'u', x:p.x, y:p.y});
  const t = trails[trails.length-1]; if (t && !t.end) t.end = performance.now();
}
pad.addEventListener('pointerup', up);
pad.addEventListener('pointercancel', up);
pad.addEventListener('lostpointercapture', up);
addEventListener('blur', () => { if (active !== null) up({pointerId: active, stale: true}); });
document.addEventListener('touchmove', e => { if (!e.target.closest('#sheet .card')) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());

/* local preview: what you draw shows briefly on the phone, then fades */
function paint(){
  const w = cv.width / (devicePixelRatio||1), h = cv.height / (devicePixelRatio||1), now = performance.now();
  ctx.clearRect(0, 0, w, h);
  drawBoard(w, h);
  trails = trails.filter(t => !t.end || now - t.end < 1600);
  for (const t of trails){
    ctx.globalAlpha = t.end ? Math.max(0, 1 - (now - t.end)/1600) : 1;
    ctx.strokeStyle = t.c; ctx.lineWidth = t.w; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath(); t.pts.forEach((p, i) => i ? ctx.lineTo(p.x*w, p.y*h) : ctx.moveTo(p.x*w, p.y*h));
    if (t.pts.length === 1) ctx.lineTo(t.pts[0].x*w + .1, t.pts[0].y*h);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  return trails.length > 0;
}
function loop(){ if (raf) return; const f = () => { raf = paint() ? requestAnimationFrame(f) : 0; }; raf = requestAnimationFrame(f); }
let wantWake = false;
async function keepAwake(){ wantWake = true; try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch(e){} }

/* ---------- connection: heartbeat + self-healing reconnect ---------- */
let lastRx = 0, pending = null, chunks = {};
const now = () => performance.now();
function retry(ms = 1500){ clearTimeout(retry.t); retry.t = setTimeout(connect, ms); }
function lost(why){
  if (conn){ const c = conn; conn = null; try { c.close(); } catch(e){} }
  if (active !== null) up({pointerId: active, stale: true});
  status('Reconnecting…'); msg('Reconnecting…', why || 'Keep the whiteboard open on the laptop.');
  retry();
}
function makePeer(){
  if (peer) try { peer.destroy(); } catch(e){}
  peer = new Peer();
  peer.on('open', () => connect());
  peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed && peer.disconnected) peer.reconnect(); } catch(e){ makePeer(); } }, 800); });
  peer.on('error', e => {
    pending = null;
    if (e.type === 'peer-unavailable'){ status('Laptop not found'); msg('Laptop not found', 'Make sure the whiteboard is open on the laptop. Retrying…'); retry(2000); }
    else if (['network','server-error','socket-error','socket-closed','unavailable-id'].includes(e.type)){ status('Reconnecting…'); setTimeout(makePeer, 2000); }
    else { status('Problem: ' + e.type); retry(2500); }
  });
}
function onData(d){
  lastRx = now();
  if (!d) return;
  if (d.cmd === 'bc'){                               // big board arrives in chunks — reassemble
    const b = chunks[d.k] = chunks[d.k] || [];
    b[d.i] = d.s;
    if (b.filter(x => x !== undefined).length === d.n){ delete chunks[d.k]; for (const k in chunks) if (+k < d.k) delete chunks[k]; try { onData(JSON.parse(b.join(''))); } catch(e){} }
    return;
  }
  if (d.cmd === 'sync'){ state = d; aspect = d.aspect || aspect; syncUI(); layout(); }
  else if (d.cmd === 'board' && keep){
    board = d;
    const t0 = now();                                // the real stroke is on the board now: let the preview go
    for (const t of trails) if (t.end) t.end = Math.min(t.end, t0 - 1300);
    paint(); loop();
  }
}
function connect(){
  if (!id || !window.Peer) return;
  if (!peer || peer.destroyed){ makePeer(); return; }
  if (peer.disconnected){ try { peer.reconnect(); } catch(e){ makePeer(); } return; }   // 'open' calls us again
  if (!peer.open || (conn && conn.open) || pending) return;
  const c = peer.connect(id, {reliable:true, serialization:'json'});
  pending = c;
  const giveUp = setTimeout(() => { if (pending === c){ pending = null; try { c.close(); } catch(e){} retry(500); } }, 8000);
  c.on('open', () => {
    clearTimeout(giveUp); pending = null; conn = c; lastRx = now();
    status('Connected to laptop', true); msg(); send({cmd:'hello'}); send({cmd:'mirror', v:keep});
  });
  c.on('data', d => { if (conn === c) onData(d); });
  c.on('close', () => { clearTimeout(giveUp); if (pending === c) pending = null; if (conn === c) lost(); });
  c.on('error', () => {});
}
// heartbeat: ping every 2 s; if the laptop has said nothing for 6 s the link is dead — rebuild it
setInterval(() => {
  if (document.hidden) return;
  if (conn && conn.open){
    send({cmd:'ping'});
    if (now() - lastRx > 6000) lost('The connection dropped.');
  } else if (conn && !conn.open) lost();
  else if (!pending) connect();
}, 2000);
if (!id){
  status('No laptop');
  msg('Open this from the laptop', 'On the whiteboard, click <b style="display:inline">Phone</b> and scan the QR code.');
} else if (!window.Peer){
  status('Offline');
  msg('Could not load', 'Check your internet connection and reload.');
} else makePeer();
function wakeUp(){
  if (document.hidden) return;
  if (wantWake && !wake) keepAwake();             // iOS drops the screen-awake lock whenever the page is hidden
  if (conn && conn.open && now() - lastRx < 4000) return;
  if (conn) lost(); else connect();
}
window.__pad = { get board(){ return board; }, get conn(){ return conn; }, get active(){ return active; }, ageRx(ms){ lastRx -= ms; } };   // for debugging
document.addEventListener('visibilitychange', wakeUp);
addEventListener('pageshow', wakeUp);
addEventListener('online', () => setTimeout(wakeUp, 500));
syncUI(); setKeep(keep, true); layout();
})();
</script>
